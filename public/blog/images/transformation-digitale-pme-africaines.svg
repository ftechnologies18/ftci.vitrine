<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Transformation digitale des PME en Afrique">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1E3D"/>
      <stop offset="50%" stop-color="#1c2d54"/>
      <stop offset="100%" stop-color="#EE6C1A"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Icône digitale stylisée -->
  <g transform="translate(880,180)" opacity="0.9">
    <rect x="0" y="0" width="200" height="140" rx="12" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <rect x="20" y="20" width="160" height="100" rx="6" fill="rgba(255,255,255,0.1)"/>
    <circle cx="100" cy="70" r="20" fill="#EE6C1A" opacity="0.8"/>
    <path d="M 80 130 L 120 130 L 100 160 Z" fill="rgba(255,255,255,0.4)"/>
  </g>
  <!-- Texte -->
  <text x="80" y="280" font-family="Poppins, Arial, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">Transformation</text>
  <text x="80" y="350" font-family="Poppins, Arial, sans-serif" font-size="56" font-weight="800" fill="#EE6C1A">digitale</text>
  <text x="80" y="430" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="rgba(255,255,255,0.7)">Des PME africaines vers la digitalisation</text>
  <text x="80" y="570" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#EE6C1A">FTCI · BLOG</text>
</svg>
