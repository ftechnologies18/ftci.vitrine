name: 🐛 Rapport de bug
description: Signaler un bug qui affecte le site en production
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce bug ! 🙏

        Avant de soumettre, vérifiez que :
        - Le bug n'est pas déjà signalé dans les [issues existantes](https://github.com/ftechnologies18/ftci.vitrine/issues)
        - Vous testez sur la dernière version déployée (https://ftci.fr)

  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Une description claire et concise du bug. Qu'est-ce qui s'est passé ? Que vous attendiez-vous à voir ?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Étapes pour reproduire
      description: Étapes détaillées pour reproduire le comportement
      value: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Scroller jusqu'à '...'
        4. Voir l'erreur
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Ce que vous pensiez qu'il allait se passer
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran / logs
      description: Si applicable, ajoutez des captures ou des logs de la console navigateur (F12 → Console)
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options:
        - Production (ftci.fr)
        - Preview (workers.dev)
        - Local (dev)
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Navigateur / device
      description: Ex : Chrome 120 sur Windows 11, Safari 17 sur iPhone 14
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexte supplémentaire
      description: Tout autre élément pertinent (erreur réseau, message spécifique, etc.)
    validations:
      required: false
